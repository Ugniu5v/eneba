<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-label="Midnight Casebook cover art">
  
  <defs>
    <linearGradient id="bgmidnightca" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#0D0A10"/>
      <stop offset="1" stop-color="#2C2230"/>
    </linearGradient>
    <radialGradient id="glowmidnightca" cx="50%" cy="35%" r="65%">
      <stop offset="0" stop-color="#F0B45C" stop-opacity=".42"/>
      <stop offset="1" stop-color="#F0B45C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shademidnightca" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".38" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="inkFademidnightca" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".62"/>
    </linearGradient>
    <pattern id="gridmidnightca" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#F0B45C" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <pattern id="dotsmidnightca" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#F0B45C" opacity=".18"/>
    </pattern>
    <filter id="grainmidnightca">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".055"/></feComponentTransfer>
    </filter>
    <filter id="blurmidnightca" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="blurSmallmidnightca" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="clipmidnightca"><rect width="600" height="800" rx="0"/></clipPath>
  </defs>
  <g clip-path="url(#clipmidnightca)">
    <rect width="600" height="800" fill="url(#bgmidnightca)"/>
    
      <circle cx="306" cy="295" r="215" fill="#F0B45C" opacity=".07"/>
      <g opacity=".18" stroke="#F0B45C">
        <path d="M0 180h600M0 220h600M0 260h600M0 460h600M0 500h600"/>
        <path d="M110 170v390M150 170v390M470 170v390M510 170v390"/>
      </g>
      <g transform="translate(212 160)">
        <path d="M38 0h86l22 42-27 49 46 36-22 100-47 36H59L12 227 0 127l45-36L18 42z" fill="#071A18" stroke="#F0B45C" stroke-width="1.5"/>
        <path d="M37 87l48 25-10 56-42-28zM122 87l-37 25 10 56 42-28z" fill="#F0B45C" opacity=".85"/>
        <path d="M82 148v62l-22 34h44z" fill="#F0B45C" opacity=".4"/>
        <path d="M28 58h108" stroke="#F0B45C" stroke-width="2" opacity=".6"/>
      </g>
      <path d="M0 630l200-75 110 30 120-62 170 70v207H0Z" fill="#06110F" opacity=".8"/>
      <path d="M0 560h600" stroke="#F0B45C" stroke-opacity=".28"/>
      <g fill="#F0B45C" opacity=".6">
        <circle cx="522" cy="254" r="3"/><circle cx="554" cy="288" r="1.5"/>
      </g>
    
  <rect width="600" height="800" fill="url(#glowmidnightca)"/>
  <rect width="600" height="800" fill="url(#gridmidnightca)" opacity=".55"/>
  <rect width="600" height="800" fill="#000" filter="url(#grainmidnightca)" opacity=".65"/>
  <rect y="420" width="600" height="380" fill="url(#shademidnightca)"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="36" y="36" width="79.6" height="28" fill="#000" opacity=".35"/>
      <text x="50" y="55" fill="#FFFFFF" font-size="11" font-weight="700" letter-spacing="2">GAME</text>
      <text x="564" y="55" text-anchor="end" fill="#F0B45C" font-size="11" font-weight="700" letter-spacing="2">EN • EUR</text>
      <g transform="translate(36 680)">
        <rect x="0" y="-42" width="44" height="4" fill="#F0B45C"/>
        <text x="0" y="0" fill="#FFFFFF" font-size="66" font-weight="900" letter-spacing="-2.5">MIDNIGHT</text>
      </g>
      <g transform="translate(36 754)">
        <text x="0" y="0" fill="#F0B45C" font-size="16" font-weight="700" letter-spacing="3.5">CASEBOOK</text>
      </g>
      <g transform="translate(36 748)" opacity=".78">
        <path d="M0 0h70" stroke="#FFFFFF" stroke-width="1"/>
        <text x="0" y="24" fill="#FFFFFF" font-size="10" font-weight="700" letter-spacing="2.6">DIGITAL DOWNLOAD</text>
        <text x="564" y="0" text-anchor="end" fill="#FFFFFF" font-size="10" font-weight="700" letter-spacing="1.7">INSTANT DELIVERY</text>
      </g>
    </g>
  </g>
</svg>