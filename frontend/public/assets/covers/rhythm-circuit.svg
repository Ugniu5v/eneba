<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-label="Rhythm Circuit cover art">
  
  <defs>
    <linearGradient id="bgrhythmcirc" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#0A0620"/>
      <stop offset="1" stop-color="#3B0F61"/>
    </linearGradient>
    <radialGradient id="glowrhythmcirc" cx="50%" cy="35%" r="65%">
      <stop offset="0" stop-color="#FF4FD8" stop-opacity=".42"/>
      <stop offset="1" stop-color="#FF4FD8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shaderhythmcirc" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".38" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="inkFaderhythmcirc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".62"/>
    </linearGradient>
    <pattern id="gridrhythmcirc" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#FF4FD8" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <pattern id="dotsrhythmcirc" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FF4FD8" opacity=".18"/>
