        <rect x="0" y="-42" width="44" height="4" fill="#FAD318"/>
        <text x="0" y="0" fill="#FFFFFF" font-size="66" font-weight="900" letter-spacing="-2.5">FARMING</text><text x="0" y="70" fill="#FFFFFF" font-size="66" font-weight="900" letter-spacing="-2.5">FRONTIER</text>
      </g>
      <g transform="translate(36 761)">
        <text x="0" y="0" fill="#FAD318" font-size="16" font-weight="700" letter-spacing="3.5">'26</text>
