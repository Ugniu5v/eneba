<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-label="Farming Frontier 26 cover art">
  
  <defs>
    <linearGradient id="bgfarmingfro" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#123A2A"/>
      <stop offset="1" stop-color="#7DAA40"/>
    </linearGradient>
    <radialGradient id="glowfarmingfro" cx="50%" cy="35%" r="65%">
      <stop offset="0" stop-color="#FAD318" stop-opacity=".42"/>
      <stop offset="1" stop-color="#FAD318" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shadefarmingfro" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".38" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="inkFadefarmingfro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".62"/>
    </linearGradient>
    <pattern id="gridfarmingfro" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#FAD318" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <pattern id="dotsfarmingfro" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FAD318" opacity=".18"/>
    </pattern>
    <filter id="grainfarmingfro">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".055"/></feComponentTransfer>
    </filter>
    <filter id="blurfarmingfro" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="blurSmallfarmingfro" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="clipfarmingfro"><rect width="600" height="800" rx="0"/></clipPath>
  </defs>
  <g clip-path="url(#clipfarmingfro)">
    <rect width="600" height="800" fill="url(#bgfarmingfro)"/>
    
      <circle cx="430" cy="210" r="92" fill="#FAD318" opacity=".82"/>
      <circle cx="430" cy="210" r="140" fill="#FAD318" opacity=".09" filter="url(#blurfarmingfro)"/>
