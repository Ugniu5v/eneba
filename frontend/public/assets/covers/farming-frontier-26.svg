        <path d="M0 510c150-76 280-62 380-14s170 35 220 10"/>
        <path d="M0 600c170-90 330-48 430-16s130 14 170-8"/>
      </g>
      <path d="M0 500c90-58 180-58 266-5 90 55 200 59 334-8v313H0Z" fill="#1B4B2D" opacity=".8"/>
      <path d="M0 620c130-50 260-55 350-25s180 30 250-5v210H0Z" fill="#0B2B20"/>
      <g transform="translate(90 476)">
        <path d="M0 80l50-38 50 38v82H0z" fill="#3D2313"/>
        <path d="M-12 82L50 34l62 48" fill="none" stroke="#FAD318" stroke-width="7"/>
        <rect x="39" y="115" width="24" height="47" fill="#130D09"/>
        <rect x="10" y="99" width="16" height="16" fill="#FAD318" opacity=".7"/>
        <rect x="74" y="99" width="16" height="16" fill="#FAD318" opacity=".7"/>
      </g>
      <g stroke="#FFFFFF" stroke-opacity=".38" stroke-width="1.4" fill="none">
        <path d="M0 696c120-60 250-70 370-30s180 28 230-4"/>
        <path d="M36 730c120-50 240-58 350-20"/>
      </g>
      <g fill="#FAD318" opacity=".8">
        <circle cx="96" cy="360" r="2"/><circle cx="120" cy="340" r="1.4"/><circle cx="78" cy="330" r="1.4"/>
      </g>
    
  <rect width="600" height="800" fill="url(#glowfarmingfro)"/>
  <rect width="600" height="800" fill="url(#gridfarmingfro)" opacity=".55"/>
  <rect width="600" height="800" fill="#000" filter="url(#grainfarmingfro)" opacity=".65"/>
  <rect y="420" width="600" height="380" fill="url(#shadefarmingfro)"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="36" y="36" width="79.6" height="28" fill="#000" opacity=".35"/>
      <text x="50" y="55" fill="#FFFFFF" font-size="11" font-weight="700" letter-spacing="2">GAME</text>
      <text x="564" y="55" text-anchor="end" fill="#FAD318" font-size="11" font-weight="700" letter-spacing="2">EN • EUR</text>
