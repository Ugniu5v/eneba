<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-label="Cyber Arena: Pulse cover art">
  
  <defs>
    <linearGradient id="bgcyberarena" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#080712"/>
      <stop offset="1" stop-color="#30115C"/>
    </linearGradient>
    <radialGradient id="glowcyberarena" cx="50%" cy="35%" r="65%">
      <stop offset="0" stop-color="#FF4BD8" stop-opacity=".42"/>
      <stop offset="1" stop-color="#FF4BD8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shadecyberarena" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".38" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="inkFadecyberarena" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".62"/>
    </linearGradient>
    <pattern id="gridcyberarena" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#FF4BD8" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <pattern id="dotscyberarena" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FF4BD8" opacity=".18"/>
    </pattern>
    <filter id="graincyberarena">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".055"/></feComponentTransfer>
    </filter>
    <filter id="blurcyberarena" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="blurSmallcyberarena" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="clipcyberarena"><rect width="600" height="800" rx="0"/></clipPath>
  </defs>
  <g clip-path="url(#clipcyberarena)">
    <rect width="600" height="800" fill="url(#bgcyberarena)"/>
    
      <circle cx="300" cy="310" r="235" fill="none" stroke="#FF4BD8" stroke-opacity=".16"/>
      <ellipse cx="300" cy="500" rx="250" ry="88" fill="none" stroke="#FF4BD8" stroke-opacity=".25"/>
      <g fill="none" stroke="#FF4BD8">
        <circle cx="300" cy="300" r="112" stroke-width="2" opacity=".7"/>
        <circle cx="300" cy="300" r="76" stroke-width="1" opacity=".3" stroke-dasharray="4 8"/>
        <path d="M300 148v96M300 356v96M148 300h96M356 300h96" stroke-width="12" opacity=".12"/>
        <path d="M170 170l52 52M430 170l-52 52M170 430l52-52M430 430l-52-52" stroke-width="1" opacity=".3"/>
      </g>
      <path d="M300 260l36 26-14 44h-44l-14-44z" fill="#FF4BD8" opacity=".8"/>
      <g fill="none" stroke="#FF4BD8" opacity=".22">
        <path d="M0 170l150 50M600 230l-150 50M0 450l120-20M600 440l-140 40"/>
        <path d="M76 0l22 120M522 800l-16-120"/>
      </g>
      <g fill="#FF4BD8" opacity=".8">
        <circle cx="94" cy="580" r="3"/><circle cx="508" cy="200" r="2"/><circle cx="450" cy="642" r="1.5"/>
      </g>
    
  <rect width="600" height="800" fill="url(#glowcyberarena)"/>
  <rect width="600" height="800" fill="url(#gridcyberarena)" opacity=".55"/>
  <rect width="600" height="800" fill="#000" filter="url(#graincyberarena)" opacity=".65"/>
  <rect y="420" width="600" height="380" fill="url(#shadecyberarena)"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="36" y="36" width="79.6" height="28" fill="#000" opacity=".35"/>
      <text x="50" y="55" fill="#FFFFFF" font-size="11" font-weight="700" letter-spacing="2">GAME</text>
      <text x="564" y="55" text-anchor="end" fill="#FF4BD8" font-size="11" font-weight="700" letter-spacing="2">EN • EUR</text>
      <g transform="translate(36 680)">
        <rect x="0" y="-42" width="44" height="4" fill="#FF4BD8"/>
        <text x="0" y="0" fill="#FFFFFF" font-size="58" font-weight="900" letter-spacing="-2.5">CYBER ARENA</text>
      </g>
      <g transform="translate(36 746)">
        <text x="0" y="0" fill="#FF4BD8" font-size="16" font-weight="700" letter-spacing="3.5">PULSE</text>
      </g>
      <g transform="translate(36 748)" opacity=".78">
        <path d="M0 0h70" stroke="#FFFFFF" stroke-width="1"/>
        <text x="0" y="24" fill="#FFFFFF" font-size="10" font-weight="700" letter-spacing="2.6">DIGITAL DOWNLOAD</text>
        <text x="564" y="0" text-anchor="end" fill="#FFFFFF" font-size="10" font-weight="700" letter-spacing="1.7">INSTANT DELIVERY</text>
      </g>
    </g>
  </g>
</svg>