<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-label="Phantom Blade: Zero Hour cover art">
  
  <defs>
    <linearGradient id="bgphantombla" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#0B0711"/>
      <stop offset="1" stop-color="#3A1018"/>
    </linearGradient>
    <radialGradient id="glowphantombla" cx="50%" cy="35%" r="65%">
      <stop offset="0" stop-color="#FF3B4D" stop-opacity=".42"/>
      <stop offset="1" stop-color="#FF3B4D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shadephantombla" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".38" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="inkFadephantombla" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".62"/>
    </linearGradient>
    <pattern id="gridphantombla" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#FF3B4D" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <pattern id="dotsphantombla" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FF3B4D" opacity=".18"/>
    </pattern>
    <filter id="grainphantombla">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".055"/></feComponentTransfer>
    </filter>
    <filter id="blurphantombla" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="blurSmallphantombla" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="clipphantombla"><rect width="600" height="800" rx="0"/></clipPath>
  </defs>
  <g clip-path="url(#clipphantombla)">
    <rect width="600" height="800" fill="url(#bgphantombla)"/>
    
      <circle cx="310" cy="300" r="230" fill="none" stroke="#FF3B4D" stroke-opacity=".12"/>
      <path d="M-30 610L500 90" stroke="#FF3B4D" stroke-width="38" opacity=".12" filter="url(#blurphantombla)"/>
      <path d="M-20 600L520 80" stroke="#FF3B4D" stroke-width="5" opacity=".85"/>
      <path d="M120 690L630 180" stroke="#FF3B4D" stroke-width="1.5" opacity=".42"/>
      <path d="M0 714L570 142" stroke="#fff" stroke-width="1" opacity=".18"/>
      <g fill="#FF3B4D" opacity=".6">
        <path d="M70 350l2 26 26 2-26 2-2 26-2-26-26-2 26-2z"/>
        <path d="M502 235l1.5 18 18 1.5-18 1.5-1.5 18-1.5-18-18-1.5 18-1.5z"/>
      </g>
      <g fill="#050307" opacity=".65">
        <path d="M0 600c110-55 200-66 300-44 98 21 190 8 300-30v274H0z"/>
      </g>
      <circle cx="475" cy="480" r="3" fill="#FF3B4D"/>
      <path d="M0 95h600" stroke="#FFFFFF" stroke-opacity=".09"/>
    
  <rect width="600" height="800" fill="url(#glowphantombla)"/>
  <rect width="600" height="800" fill="url(#gridphantombla)" opacity=".55"/>
  <rect width="600" height="800" fill="#000" filter="url(#grainphantombla)" opacity=".65"/>
  <rect y="420" width="600" height="380" fill="url(#shadephantombla)"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="36" y="36" width="79.6" height="28" fill="#000" opacity=".35"/>
      <text x="50" y="55" fill="#FFFFFF" font-size="11" font-weight="700" letter-spacing="2">GAME</text>
      <text x="564" y="55" text-anchor="end" fill="#FF3B4D" font-size="11" font-weight="700" letter-spacing="2">EN • EUR</text>
      <g transform="translate(36 617)">
        <rect x="0" y="-42" width="44" height="4" fill="#FF3B4D"/>
        <text x="0" y="0" fill="#FFFFFF" font-size="66" font-weight="900" letter-spacing="-2.5">PHANTOM</text><text x="0" y="70" fill="#FFFFFF" font-size="66" font-weight="900" letter-spacing="-2.5">BLADE</text>
      </g>
      <g transform="translate(36 761)">
        <text x="0" y="0" fill="#FF3B4D" font-size="16" font-weight="700" letter-spacing="3.5">ZERO HOUR</text>
      </g>
      <g transform="translate(36 748)" opacity=".78">
        <path d="M0 0h70" stroke="#FFFFFF" stroke-width="1"/>
        <text x="0" y="24" fill="#FFFFFF" font-size="10" font-weight="700" letter-spacing="2.6">DIGITAL DOWNLOAD</text>
        <text x="564" y="0" text-anchor="end" fill="#FFFFFF" font-size="10" font-weight="700" letter-spacing="1.7">INSTANT DELIVERY</text>
      </g>
    </g>
  </g>
</svg>