      <path d="M0 560h600" stroke="#3CE0C0" stroke-opacity=".28"/>
      <g fill="#3CE0C0" opacity=".6">
        <circle cx="522" cy="254" r="3"/><circle cx="554" cy="288" r="1.5"/>
      </g>
    
  <rect width="600" height="800" fill="url(#glowshadowheis)"/>
  <rect width="600" height="800" fill="url(#gridshadowheis)" opacity=".55"/>
  <rect width="600" height="800" fill="#000" filter="url(#grainshadowheis)" opacity=".65"/>
  <rect y="420" width="600" height="380" fill="url(#shadeshadowheis)"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="36" y="36" width="79.6" height="28" fill="#000" opacity=".35"/>
